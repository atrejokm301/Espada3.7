[package]
name = "asignacion-del-cielo-bible"
version = "0.1.0"
description = "Asignación del Cielo Bible — estudio bíblico offline"
authors = ["Asignación del Cielo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "asignacion_del_cielo_bible_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
regex = "1.13.1"
once_cell = "1.21.4"
html-escape = "0.2.14"
flate2 = "1.1.9"

# Ship profile: max runtime speed (full fat LTO — slower link, best binary).
# Use: cargo build --release   →  target/release/asignacion-del-cielo-bible.exe
# Daily coding stays on debug (fast compile). This only affects --release.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Optional: thinner/faster link for interim builds (not max ship).
# cargo build --profile release-fast
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true

