[package]
name = "espada3_7"
version = "3.7.0"
description = "Espada3.7 — Asignación del Cielo Bible (macOS)"
authors = ["Asignación del Cielo"]
edition = "2021"
default-run = "espada3_7"

[lib]
name = "espada3_7_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Default binary = GUI app (must stay the only non-feature bin for tauri bundle)
[[bin]]
name = "espada3_7"
path = "src/main.rs"

# Offline PGO trainer — only with --features pgo-harness
[[bin]]
name = "pgo_harness"
path = "src/bin/pgo_harness.rs"
required-features = ["pgo-harness"]

[features]
default = []
pgo-harness = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
once_cell = "1"
parking_lot = "0.12"
encoding_rs = "0.8"
html-escape = "0.2"
walkdir = "2"
thiserror = "2"
# Native macOS NSVisualEffectView (desktop bleed under transparent webview)
window-vibrancy = "0.6"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
  "NSWindow",
  "NSView",
  "NSColor",
  "NSGraphics",
  "NSResponder",
  "NSAppearance",
] }

# Aggressive release profile — mirrors iOS EspadaSwift build-release.sh “goodies”:
#   LLVM_LTO=YES (fat)  → lto = "fat"
#   GCC/SWIFT -O3 / -O  → opt-level = 3
#   DEAD_CODE_STRIPPING → LTO + strip + -dead_strip (see build-release.sh RUSTFLAGS)
#   wholemodule / cg=1  → codegen-units = 1
# -march=native / CFLAGS -O3 via .cargo/config.toml + build-release.sh
[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
debug = false
incremental = false
overflow-checks = false
