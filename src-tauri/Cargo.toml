[package]
name = "asignacion-del-cielo-bible"
version = "3.7.0"
description = "Espada 3.7 — estudio bíblico offline for Windows"
authors = ["Espada"]
edition = "2021"
default-run = "asignacion-del-cielo-bible"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "asignacion_del_cielo_bible_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Default binary is the Tauri desktop app (src/main.rs).
# WinUI 3 host talks to this sidecar for the same e-Sword commands:
#   cargo run --bin adc-api
[[bin]]
name = "adc-api"
path = "src/bin/adc_api.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No devtools in release (smaller binary, no inspector overhead).
# Debug builds can enable via: cargo build --features devtools
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
regex = "1.13.1"
once_cell = "1.21.4"
html-escape = "0.2.14"
flate2 = "1.1.9"

[features]
default = []
devtools = ["tauri/devtools"]

# ---------------------------------------------------------------------------
# Release: max runtime speed + smaller binary (slower compile/link is fine)
#   cargo build --release
#   cargo tauri build
# LLVM "fast-math" / CPU tune: see .cargo/config.toml + scripts/build-release.ps1
# ---------------------------------------------------------------------------
[profile.release]
# -O3 equivalent
opt-level = 3
# Full-program LTO across crates (best inlining / dead-code elimination)
lto = "fat"
# Single codegen unit → better optimization (slower compile)
codegen-units = 1
# Smaller binary, no unwind tables
panic = "abort"
# Strip symbols from the final binary (less disk + RAM for mappings)
strip = "symbols"
# No debuginfo in ship builds
debug = false
debug-assertions = false
overflow-checks = false
# Cleaner, fully optimized links
incremental = false
rpath = false

# Optimize every dependency the same way (rusqlite, regex, tauri, …)
[profile.release.package."*"]
opt-level = 3
# Keep dep debug off so we don't bloat
debug = false

# Optional: thinner LTO for interim release testing (faster link, slightly less peak opt)
# cargo build --profile release-fast
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"

